<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skeliner Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: monospace; color: #ccc; }
  #canvas-container { width: 100vw; height: 100vh; }
  #info {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
    font-size: 12px; line-height: 1.6; pointer-events: none;
    max-width: 400px;
  }
  #info .label { color: #888; }
  #info .value { color: #eee; }
  #controls {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
    font-size: 12px;
  }
  #controls label { margin-right: 12px; cursor: pointer; }
  #controls input[type=range] { width: 120px; vertical-align: middle; }
  #selection-info {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
    font-size: 12px; line-height: 1.6; max-width: 300px;
  }
  .hl-item { display: flex; justify-content: space-between; align-items: center; }
  .hl-item button { font-size: 10px; cursor: pointer; margin-left: 8px; }
  .hl-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  #loaded-panel {
    position: absolute; bottom: 50px; right: 10px;
    background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
    font-size: 12px; line-height: 1.8; max-width: 300px;
  }
  #loaded-panel .item { display: flex; justify-content: space-between; align-items: center; }
  #loaded-panel .item button { font-size: 10px; cursor: pointer; margin-left: 8px; }
  #loaded-panel .item .name { color: #adf; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #drop-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 120, 255, 0.15); border: 3px dashed rgba(0, 120, 255, 0.6);
    z-index: 999; pointer-events: none;
    justify-content: center; align-items: center;
    font-size: 24px; color: #4af;
  }
  #empty-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 16px; color: #555; text-align: center; line-height: 2;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="empty-hint">Drop mesh (.obj, .ply) or skeleton (.swc, .npz) here</div>
<div id="drop-overlay">Drop file to load</div>

<div id="info">
  <div><span class="label">Vertices: </span><span class="value" id="nVerts">-</span></div>
  <div><span class="label">Faces: </span><span class="value" id="nFaces">-</span></div>
  <div><span class="label">Skel nodes: </span><span class="value" id="nNodes">-</span></div>
  <div><span class="label">Camera: </span><span class="value" id="camPos">-</span></div>
  <div><span class="label">Visible faces: </span><span class="value" id="visCount">-</span></div>
</div>

<div id="controls">
  <label>Clip plane: <input type="range" id="clipSlider" min="0" max="100" value="100"></label>
  <label><input type="checkbox" id="wireToggle" checked> Wireframe</label>
  <label>Opacity: <input type="range" id="opacitySlider" min="0" max="100" value="50"></label>
  <label><input type="checkbox" id="tubeToggle"> Tubes</label>
  <label style="margin-left:8px;">Pick: <select id="pickTarget" style="font-size:11px;">
    <option value="mesh">Mesh</option>
  </select></label>
  <button id="detectBtn" style="font-size:11px;cursor:pointer;margin-left:8px;">Detect Organelles (A)</button>
</div>

<div id="selection-info">
  <div><span class="label">Click: select | Shift+click: highlight</span></div>
  <div id="selDetail"></div>
  <div><span class="label">Highlighted: </span><span class="value" id="hlCount">0</span> <button id="hlClear" style="font-size:11px;cursor:pointer;">Clear</button></div>
  <div id="hlList" style="margin-top:4px;"></div>
  <div id="hlClearAllRow" style="display:none;margin-top:2px;"><button id="hlClearAll" style="font-size:10px;cursor:pointer;">Clear All Annotations</button></div>
</div>

<div id="loaded-panel">
  <div style="color:#888;margin-bottom:4px;">Loaded:</div>
  <div id="loadedMesh" class="item" style="display:none;">
    <span class="name" id="meshName">-</span>
    <button id="removeMesh">x</button>
  </div>
  <div id="loadedSkel"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Globals ──────────────────────────────────────────────────────────
let scene, camera, renderer, controls;
let meshObj, wireframeObj, meshGeometry, clipPlane;
let skelGroups = {};  // keyed by skeleton name
let ws = null;
let stateDebounceTimer = null;
const STATE_DEBOUNCE_MS = 300;

let annotationMeshes = [];
let manualHighlightFaces = new Set();
let manualHighlightMesh = null;

// ── Init ─────────────────────────────────────────────────────────────
async function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0f1a);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
  camera.position.set(0, 0, 500);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.localClippingEnabled = true;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 99999);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  controls.addEventListener('change', scheduleStateUpdate);

  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const dl1 = new THREE.DirectionalLight(0xffffff, 0.8);
  dl1.position.set(1, 1, 1);
  scene.add(dl1);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dl2.position.set(-1, -0.5, -1);
  scene.add(dl2);

  // Try loading pre-loaded mesh
  const meshResp = await fetch('/mesh');
  const meshData = await meshResp.json();
  if (meshData) {
    buildMesh(meshData);
    document.getElementById('empty-hint').style.display = 'none';
  }

  // Try loading pre-loaded skeletons
  const skelResp = await fetch('/skeletons');
  const skelDataAll = await skelResp.json();
  if (skelDataAll) {
    for (const [name, data] of Object.entries(skelDataAll)) {
      buildSkeleton({ name, ...data });
    }
  }

  // Update loaded panel
  updateLoadedPanel();

  setupControls();
  setupDragDrop();

  renderer.domElement.addEventListener('click', onClickSelect);
  document.getElementById('hlClear').addEventListener('click', () => {
    manualHighlightFaces.clear();
    rebuildManualHighlight();
    syncManualHighlight();
  });

  renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
  renderer.domElement.addEventListener('pointerdown', onRecenter);

  document.getElementById('detectBtn').addEventListener('click', runDetectOrganelles);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'a' && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.target === document.body) {
      runDetectOrganelles();
    }
  });

  document.getElementById('removeMesh').addEventListener('click', () => removeItem('mesh'));
  document.getElementById('hlClearAll').addEventListener('click', clearAllAnnotations);

  connectWebSocket();

  fetch('/annotations').then(r => r.json()).then(ann => {
    if (ann && ann.highlights) applyAnnotations(ann);
  }).catch(() => {});

  window.addEventListener('resize', onResize);
  animate();
}

// ── Loaded panel ─────────────────────────────────────────────────────
async function updateLoadedPanel() {
  try {
    const resp = await fetch('/loaded');
    const data = await resp.json();
    const meshEl = document.getElementById('loadedMesh');
    const skelEl = document.getElementById('loadedSkel');
    if (data.mesh) {
      meshEl.style.display = 'flex';
      document.getElementById('meshName').textContent =
        data.mesh.path.split('/').pop() + ` (${data.mesh.nVertices.toLocaleString()}v)`;
    } else {
      meshEl.style.display = 'none';
    }
    // Show all loaded skeletons
    const skelContainer = document.getElementById('loadedSkel');
    skelContainer.innerHTML = '';
    if (data.skeletons) {
      for (const [sname, sinfo] of Object.entries(data.skeletons)) {
        const div = document.createElement('div');
        div.className = 'item';
        div.style.display = 'flex';
        const c = sinfo.color || [1,1,1];
        const rgb = `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
        div.innerHTML = `<span class="name" style="color:${rgb}">${sname} (${sinfo.nNodes.toLocaleString()}n)</span>`;
        const btn = document.createElement('button');
        btn.textContent = 'x';
        btn.addEventListener('click', () => removeItem('skeleton', sname));
        div.appendChild(btn);
        skelContainer.appendChild(div);
      }
    }
  } catch (e) {}
}

async function removeItem(type, name) {
  await fetch('/remove', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, name }),
  });
}

// ── Drag & Drop ──────────────────────────────────────────────────────
function setupDragDrop() {
  const overlay = document.getElementById('drop-overlay');
  let dragCounter = 0;

  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    overlay.style.display = 'flex';
  });
  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) { overlay.style.display = 'none'; dragCounter = 0; }
  });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragCounter = 0;
    overlay.style.display = 'none';

    for (const file of e.dataTransfer.files) {
      const formData = new FormData();
      formData.append('file', file);
      try {
        const resp = await fetch('/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        if (data.ok) {
          console.log(`[skeliner] Loaded ${data.type}: ${data.name}`);
        } else {
          console.error(`[skeliner] Upload failed: ${data.error}`);
        }
      } catch (err) {
        console.error('[skeliner] Upload error:', err);
      }
    }
  });
}

// ── Build mesh ───────────────────────────────────────────────────────
function buildMesh(data) {
  // Remove old mesh
  if (meshObj) { scene.remove(meshObj); meshObj.geometry.dispose(); meshObj.material.dispose(); meshObj = null; }
  if (wireframeObj) { scene.remove(wireframeObj); wireframeObj.geometry.dispose(); wireframeObj.material.dispose(); wireframeObj = null; }
  meshGeometry = null;

  const { vertices, faces, nVertices, nFaces } = data;

  document.getElementById('nVerts').textContent = nVertices.toLocaleString();
  document.getElementById('nFaces').textContent = nFaces.toLocaleString();
  document.getElementById('empty-hint').style.display = 'none';

  meshGeometry = new THREE.BufferGeometry();
  const positions = new Float32Array(nFaces * 9);
  const colors = new Float32Array(nFaces * 9);
  const verts = new Float32Array(vertices);

  for (let i = 0; i < nFaces; i++) {
    const a = faces[i * 3], b = faces[i * 3 + 1], c = faces[i * 3 + 2];
    for (let k = 0; k < 3; k++) {
      positions[i * 9 + k] = verts[a * 3 + k];
      positions[i * 9 + 3 + k] = verts[b * 3 + k];
      positions[i * 9 + 6 + k] = verts[c * 3 + k];
    }
    const r = 0.55, g = 0.55, bl = 0.6;
    for (let v = 0; v < 3; v++) {
      colors[i * 9 + v * 3] = r;
      colors[i * 9 + v * 3 + 1] = g;
      colors[i * 9 + v * 3 + 2] = bl;
    }
  }

  meshGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  meshGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  meshGeometry.computeVertexNormals();

  meshObj = new THREE.Mesh(meshGeometry, new THREE.MeshPhongMaterial({
    vertexColors: true, side: THREE.DoubleSide, clippingPlanes: [clipPlane],
    shininess: 30, transparent: true, opacity: 0.5, depthWrite: false,
  }));
  scene.add(meshObj);

  wireframeObj = new THREE.Mesh(meshGeometry, new THREE.MeshBasicMaterial({
    wireframe: true, color: 0x333333, transparent: true, opacity: 0.15,
    clippingPlanes: [clipPlane],
  }));
  wireframeObj.visible = document.getElementById('wireToggle').checked;
  scene.add(wireframeObj);

  fitCamera();
}

// ── Build skeleton ───────────────────────────────────────────────────
let selectedNodes = {};  // { "skelName:nodeIndex": { mesh, skelName, nodeIndex } }

function buildSkeleton(data) {
  const name = data.name || 'default';
  const baseColor = data.color || [1.0, 0.4, 0.1];

  // Remove old version of this skeleton
  if (skelGroups[name]) {
    scene.remove(skelGroups[name].group);
    skelGroups[name] = null;
    delete skelGroups[name];
  }

  const { nodes, positions, nNodes, nEdges, edgeRadii, radii } = data;
  if (!nodes || nNodes === 0) return;

  document.getElementById('nNodes').textContent =
    Object.keys(skelGroups).length > 0
      ? Object.values(skelGroups).reduce((s, g) => s + g.nNodes, nNodes).toLocaleString()
      : nNodes.toLocaleString();
  document.getElementById('empty-hint').style.display = 'none';

  const group = new THREE.Group();
  const nodesArr = new Float32Array(nodes);
  const radiiArr = new Float32Array(radii);

  // ── Node points (colored by skeleton identity) ─────────────────
  const nodeGeo = new THREE.BufferGeometry();
  nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodesArr, 3));

  const nodeColors = new Float32Array(nNodes * 3);
  for (let i = 0; i < nNodes; i++) {
    nodeColors[i*3] = baseColor[0];
    nodeColors[i*3+1] = baseColor[1];
    nodeColors[i*3+2] = baseColor[2];
  }
  nodeGeo.setAttribute('color', new THREE.BufferAttribute(nodeColors, 3));

  const nodePoints = new THREE.Points(nodeGeo, new THREE.PointsMaterial({
    vertexColors: true, size: 5, sizeAttenuation: false,
    depthTest: true, depthWrite: true,
  }));
  group.add(nodePoints);

  // ── Lines (colored by skeleton identity) ────────────────────────
  let lines = null;
  if (nEdges > 0 && positions) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));

    const colorArr = new Float32Array(nEdges * 6);
    for (let i = 0; i < nEdges; i++) {
      colorArr[i*6]=baseColor[0]; colorArr[i*6+1]=baseColor[1]; colorArr[i*6+2]=baseColor[2];
      colorArr[i*6+3]=baseColor[0]; colorArr[i*6+4]=baseColor[1]; colorArr[i*6+5]=baseColor[2];
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));
    lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 2 }));
    group.add(lines);
  }

  scene.add(group);

  skelGroups[name] = {
    group, nodePoints, lines, radii: radiiArr, nNodes, nEdges,
    color: baseColor, data,
  };

  // Add to pick dropdown if not already there
  const pickSelect = document.getElementById('pickTarget');
  if (!pickSelect.querySelector(`option[value="skel:${name}"]`)) {
    const opt = document.createElement('option');
    opt.value = `skel:${name}`;
    opt.textContent = name;
    pickSelect.appendChild(opt);
  }

  if (!meshObj) fitCamera();
  updateLoadedPanel();
}

function buildTubes(name) {
  const sg = skelGroups[name];
  if (!sg || sg.tubes) return;
  const { nodes, edges, radii, nEdges } = sg.data;
  const nodesArr = new Float32Array(nodes);
  const radiiArr = new Float32Array(radii);
  const baseColor = sg.color;
  const tubes = new THREE.Group();
  const segments = 6;

  for (let i = 0; i < nEdges; i++) {
    const a = edges[i * 2], b = edges[i * 2 + 1];
    const ax = nodesArr[a*3], ay = nodesArr[a*3+1], az = nodesArr[a*3+2];
    const bx = nodesArr[b*3], by = nodesArr[b*3+1], bz = nodesArr[b*3+2];
    const rA = radiiArr[a], rB = radiiArr[b];
    const dx = bx-ax, dy = by-ay, dz = bz-az;
    const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (len < 1e-6) continue;

    const cylGeo = new THREE.CylinderGeometry(rB, rA, len, segments, 1, true);
    const cylMat = new THREE.MeshPhongMaterial({
      color: new THREE.Color(baseColor[0], baseColor[1], baseColor[2]),
      transparent: true, opacity: 0.6,
    });
    const cyl = new THREE.Mesh(cylGeo, cylMat);
    cyl.position.set((ax+bx)/2, (ay+by)/2, (az+bz)/2);
    const dir = new THREE.Vector3(dx, dy, dz).normalize();
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    tubes.add(cyl);
  }
  sg.tubes = tubes;
  sg.group.add(tubes);
}

// ── Fit camera ───────────────────────────────────────────────────────
function fitCamera() {
  // Find bounding sphere from whatever is loaded
  let box = new THREE.Box3();
  if (meshGeometry) {
    meshGeometry.computeBoundingBox();
    box.union(meshGeometry.boundingBox);
  }
  for (const sg of Object.values(skelGroups)) {
    if (sg && sg.group) {
      const skelBox = new THREE.Box3().setFromObject(sg.group);
      box.union(skelBox);
    }
  }
  if (box.isEmpty()) return;

  const sphere = new THREE.Sphere();
  box.getBoundingSphere(sphere);

  camera.near = sphere.radius * 0.001;
  camera.far = sphere.radius * 10;
  camera.updateProjectionMatrix();
  camera.position.set(sphere.center.x, sphere.center.y, sphere.center.z + sphere.radius * 2);
  controls.target.copy(sphere.center);
  controls.update();

  const clipSlider = document.getElementById('clipSlider');
  clipSlider._bsRadius = sphere.radius;
  clipSlider._bsCenter = sphere.center.z;
}

// ── Controls ─────────────────────────────────────────────────────────
function setupControls() {
  document.getElementById('clipSlider').addEventListener('input', (e) => {
    const pct = parseInt(e.target.value);
    const r = e.target._bsRadius || 500;
    const cz = e.target._bsCenter || 0;
    clipPlane.constant = cz - r + (pct / 100) * r * 2;
    scheduleStateUpdate();
  });
  document.getElementById('wireToggle').addEventListener('change', (e) => {
    if (wireframeObj) wireframeObj.visible = e.target.checked;
  });
  document.getElementById('tubeToggle').addEventListener('change', (e) => {
    for (const [name, sg] of Object.entries(skelGroups)) {
      if (!sg) continue;
      if (e.target.checked) {
        buildTubes(name);
        if (sg.lines) sg.lines.visible = false;
        if (sg.tubes) sg.tubes.visible = true;
      } else {
        if (sg.lines) sg.lines.visible = true;
        if (sg.tubes) sg.tubes.visible = false;
      }
    }
  });
  document.getElementById('opacitySlider').addEventListener('input', (e) => {
    const val = parseInt(e.target.value) / 100;
    if (meshObj) {
      meshObj.material.transparent = val < 1.0;
      meshObj.material.opacity = val;
      meshObj.material.depthWrite = val >= 1.0;
      meshObj.material.needsUpdate = true;
    }
  });
}

// ── Click selection ──────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onClickSelect(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const pickTarget = document.getElementById('pickTarget').value;

  if (pickTarget.startsWith('skel:')) {
    const targetSkelName = pickTarget.slice(5);
    const sg = skelGroups[targetSkelName];
    if (!sg || !sg.nodePoints) return;

    const camDist = camera.position.distanceTo(controls.target);
    raycaster.params.Points.threshold = camDist * 0.02;
    const hits = raycaster.intersectObject(sg.nodePoints);
    if (hits.length === 0) return;

    const bestHit = hits[0];
    const bestSkelName = targetSkelName;
    const skelNodeRadii = sg.radii;
    const skelColor = skelGroups[bestSkelName].color;

    const nodeIndex = bestHit.index;
    const point = bestHit.point;
    const radius = skelNodeRadii ? skelNodeRadii[nodeIndex] : null;
    const key = `${bestSkelName}:${nodeIndex}`;

    // Click same node again → deselect
    if (selectedNodes[key]) {
      scene.remove(selectedNodes[key].mesh);
      selectedNodes[key].mesh.geometry.dispose();
      selectedNodes[key].mesh.material.dispose();
      delete selectedNodes[key];
      updateNodeSelectionDisplay();
      syncNodeSelections();
      return;
    }

    // Add to selection
    const sphereR = radius !== null ? radius : 100;
    const sphereGeo = new THREE.SphereGeometry(sphereR, 16, 12);
    const sc = skelColor || [1, 0.3, 0.3];
    const sphereMat = new THREE.MeshPhongMaterial({
      color: new THREE.Color(sc[0], sc[1], sc[2]),
      transparent: true, opacity: 0.4, depthTest: true,
    });
    const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
    sphereMesh.position.copy(point);
    scene.add(sphereMesh);

    selectedNodes[key] = {
      mesh: sphereMesh, skelName: bestSkelName, nodeIndex, radius,
      point: [point.x, point.y, point.z],
    };

    updateNodeSelectionDisplay();
    syncNodeSelections();
    return;
  }

  // Mesh picking
  if (!meshObj) return;
  const hits = raycaster.intersectObject(meshObj);
  if (hits.length === 0) return;

  const hit = hits[0];
  const faceIndex = hit.faceIndex;
  const point = hit.point;
  if (event.shiftKey) {
    if (manualHighlightFaces.has(faceIndex)) manualHighlightFaces.delete(faceIndex);
    else manualHighlightFaces.add(faceIndex);
    rebuildManualHighlight();
    syncManualHighlight();
    return;
  }

  const selInfo = { faceIndex, point: [point.x.toFixed(2), point.y.toFixed(2), point.z.toFixed(2)] };
  document.getElementById('selDetail').innerHTML =
    `<div>Face: <b>${faceIndex}</b></div><div>Pos: ${selInfo.point.join(', ')}</div>`;

  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'selection', payload: selInfo }));
  else fetch('/update_selection', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(selInfo) }).catch(() => {});
}

// ── Node selection display & sync ─────────────────────────────────────
function updateNodeSelectionDisplay() {
  const keys = Object.keys(selectedNodes);
  if (keys.length === 0) {
    document.getElementById('selDetail').innerHTML = '';
    return;
  }
  let html = '';
  for (const key of keys) {
    const s = selectedNodes[key];
    const c = skelGroups[s.skelName] ? skelGroups[s.skelName].color : [1,1,1];
    const rgb = `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
    html += `<div style="color:${rgb}">Node ${s.nodeIndex} (${s.skelName}) r=${s.radius !== null ? s.radius.toFixed(0) : '?'}</div>`;
  }
  document.getElementById('selDetail').innerHTML = html;
}

function syncNodeSelections() {
  const payload = {};
  for (const [key, s] of Object.entries(selectedNodes)) {
    payload[key] = {
      skelName: s.skelName, nodeIndex: s.nodeIndex,
      radius: s.radius, point: s.point.map(v => v.toFixed(2)),
    };
  }
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'node_selection', payload }));
  } else {
    fetch('/update_selection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nodeSelections: payload }),
    }).catch(() => {});
  }
}

// ── Manual highlight ─────────────────────────────────────────────────
function rebuildManualHighlight() {
  if (manualHighlightMesh) { scene.remove(manualHighlightMesh); manualHighlightMesh.geometry.dispose(); manualHighlightMesh.material.dispose(); manualHighlightMesh = null; }
  const faces = Array.from(manualHighlightFaces);
  document.getElementById('hlCount').textContent = faces.length;
  if (faces.length === 0 || !meshGeometry) return;

  const posAttr = meshGeometry.getAttribute('position');
  const positions = new Float32Array(faces.length * 9);
  for (let j = 0; j < faces.length; j++) { const base = faces[j] * 9; for (let k = 0; k < 9; k++) positions[j * 9 + k] = posAttr.array[base + k]; }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.computeVertexNormals();
  manualHighlightMesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
    color: new THREE.Color(1, 0.8, 0), side: THREE.DoubleSide, clippingPlanes: [clipPlane],
    transparent: true, opacity: 0.9, polygonOffset: true, polygonOffsetFactor: -2,
  }));
  scene.add(manualHighlightMesh);
}

async function runDetectOrganelles() {
  const btn = document.getElementById('detectBtn');
  btn.textContent = 'Detecting...'; btn.disabled = true;
  try {
    const resp = await fetch('/detect_organelles', { method: 'POST' });
    const data = await resp.json();
    btn.textContent = data.ok ? `Organelles: ${data.nFaces} (A)` : 'Error (A)';
  } catch (e) { btn.textContent = 'Error (A)'; } finally { btn.disabled = false; }
}

function syncManualHighlight() {
  const payload = { manualHighlight: Array.from(manualHighlightFaces) };
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'manual_highlight', payload }));
  else fetch('/update_selection', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).catch(() => {});
}

// ── Right-click / Ctrl+click to recenter ─────────────────────────
let pointerDownPos = null;
function onRecenter(event) {
  const isRight = event.button === 2;
  const isCtrlLeft = event.button === 0 && (event.ctrlKey || event.metaKey);
  if (!isRight && !isCtrlLeft) return;
  pointerDownPos = { x: event.clientX, y: event.clientY };
  const onUp = (upEvent) => {
    renderer.domElement.removeEventListener('pointerup', onUp);
    if (!pointerDownPos) return;
    if (Math.sqrt((upEvent.clientX - pointerDownPos.x)**2 + (upEvent.clientY - pointerDownPos.y)**2) > 5) return;
    mouse.x = (upEvent.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(upEvent.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    if (!meshObj) return;
    const hits = raycaster.intersectObject(meshObj);
    if (hits.length === 0) return;
    const pickPoint = hits[0].point;
    const offset = camera.position.clone().sub(controls.target);
    controls.target.copy(pickPoint);
    camera.position.copy(pickPoint).add(offset);
    controls.update();
    scheduleStateUpdate();
  };
  renderer.domElement.addEventListener('pointerup', onUp);
}

// ── Visible face computation ─────────────────────────────────────────
function computeVisibleFaceCount() {
  if (!meshGeometry) return 0;
  const frustum = new THREE.Frustum();
  const m = new THREE.Matrix4();
  m.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(m);
  const pos = meshGeometry.getAttribute('position');
  const nFaces = pos.count / 3;
  let visible = 0;
  const c = new THREE.Vector3();
  const step = Math.max(1, Math.floor(nFaces / 10000));
  let sampled = 0;
  for (let i = 0; i < nFaces; i += step) {
    const b = i * 9;
    c.set((pos.array[b]+pos.array[b+3]+pos.array[b+6])/3, (pos.array[b+1]+pos.array[b+4]+pos.array[b+7])/3, (pos.array[b+2]+pos.array[b+5]+pos.array[b+8])/3);
    if (frustum.containsPoint(c) && clipPlane.distanceToPoint(c) >= 0) visible++;
    sampled++;
  }
  return Math.round((visible / sampled) * nFaces);
}

// ── State updates ────────────────────────────────────────────────────
function scheduleStateUpdate() { if (stateDebounceTimer) clearTimeout(stateDebounceTimer); stateDebounceTimer = setTimeout(sendStateUpdate, STATE_DEBOUNCE_MS); }

function sendStateUpdate() {
  const visCount = computeVisibleFaceCount();
  document.getElementById('visCount').textContent = visCount.toLocaleString();
  document.getElementById('camPos').textContent = `(${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)})`;
  const state = {
    camera: { position: camera.position.toArray(), target: controls.target.toArray(), up: camera.up.toArray(), fov: camera.fov, near: camera.near, far: camera.far },
    clipPlane: { normal: [clipPlane.normal.x, clipPlane.normal.y, clipPlane.normal.z], constant: clipPlane.constant },
    ui: { opacity: meshObj ? meshObj.material.opacity : 1.0, wireframe: wireframeObj ? wireframeObj.visible : false },
    visibleFaceCount: visCount,
  };
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'state_update', payload: state }));
  else fetch('/update_state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) }).catch(() => {});
}

// ── Annotations ──────────────────────────────────────────────────────
let currentAnnotations = null;  // cached for panel rebuild

function applyAnnotations(annotations) {
  for (const m of annotationMeshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  annotationMeshes = [];
  currentAnnotations = annotations;
  updateHighlightsPanel();
  if (!annotations || !annotations.highlights || !meshGeometry) return;
  const posAttr = meshGeometry.getAttribute('position');
  for (const group of annotations.highlights) {
    const fi = group.faces || []; if (fi.length === 0) continue;
    const color = group.color || [1, 0, 0];
    const pos = new Float32Array(fi.length * 9);
    for (let j = 0; j < fi.length; j++) { const base = fi[j] * 9; for (let k = 0; k < 9; k++) pos[j * 9 + k] = posAttr.array[base + k]; }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    const mat = new THREE.MeshPhongMaterial({ color: new THREE.Color(color[0], color[1], color[2]), side: THREE.DoubleSide, clippingPlanes: [clipPlane], transparent: true, opacity: 0.9, polygonOffset: true, polygonOffsetFactor: -1 });
    const hlm = new THREE.Mesh(geo, mat);
    scene.add(hlm); annotationMeshes.push(hlm);
  }
}

function updateHighlightsPanel() {
  const list = document.getElementById('hlList');
  list.innerHTML = '';
  const clearRow = document.getElementById('hlClearAllRow');
  if (!currentAnnotations || !currentAnnotations.highlights || currentAnnotations.highlights.length === 0) {
    clearRow.style.display = 'none';
    return;
  }
  clearRow.style.display = 'block';
  currentAnnotations.highlights.forEach((group, idx) => {
    const n = (group.faces || []).length;
    if (n === 0) return;
    const color = group.color || [1, 0, 0];
    const label = group.label || `Group ${idx}`;
    const div = document.createElement('div');
    div.className = 'hl-item';
    const rgb = `rgb(${Math.round(color[0]*255)},${Math.round(color[1]*255)},${Math.round(color[2]*255)})`;
    div.innerHTML = `<span><span class="hl-swatch" style="background:${rgb}"></span>${label} (${n.toLocaleString()})</span>`;
    const btn = document.createElement('button');
    btn.textContent = 'x';
    btn.addEventListener('click', () => removeAnnotationGroup(idx));
    div.appendChild(btn);
    list.appendChild(div);
  });
}

function removeAnnotationGroup(idx) {
  if (!currentAnnotations || !currentAnnotations.highlights) return;
  currentAnnotations.highlights.splice(idx, 1);
  // Remove from scene
  if (annotationMeshes[idx]) {
    scene.remove(annotationMeshes[idx]);
    annotationMeshes[idx].geometry.dispose();
    annotationMeshes[idx].material.dispose();
    annotationMeshes.splice(idx, 1);
  }
  updateHighlightsPanel();
  // Sync to server
  fetch('/update_annotations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(currentAnnotations),
  }).catch(() => {});
}

function clearAllAnnotations() {
  for (const m of annotationMeshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  annotationMeshes = [];
  currentAnnotations = { highlights: [] };
  updateHighlightsPanel();
  fetch('/update_annotations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(currentAnnotations),
  }).catch(() => {});
}

function applyCameraCommand(cmd) {
  if (cmd.position) camera.position.fromArray(cmd.position);
  if (cmd.target) controls.target.fromArray(cmd.target);
  if (cmd.up) camera.up.fromArray(cmd.up);
  if (cmd.fov) { camera.fov = cmd.fov; camera.updateProjectionMatrix(); }
  controls.update(); scheduleStateUpdate();
}

// ── WebSocket ────────────────────────────────────────────────────────
function connectWebSocket() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
  ws.onopen = () => console.log('[skeliner] WebSocket connected');
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'annotations') applyAnnotations(msg.payload);
    else if (msg.type === 'camera_command') applyCameraCommand(msg.payload);
    else if (msg.type === 'reload') window.location.reload();
    else if (msg.type === 'mesh_loaded') { buildMesh(msg.payload); updateLoadedPanel(); }
    else if (msg.type === 'skeleton_loaded') { buildSkeleton(msg.payload); }
    else if (msg.type === 'skeleton_removed') {
      const sname = msg.payload && msg.payload.name;
      if (sname && skelGroups[sname]) {
        scene.remove(skelGroups[sname].group);
        delete skelGroups[sname];
        const opt = document.querySelector(`#pickTarget option[value="skel:${sname}"]`);
        if (opt) opt.remove();
      }
      updateLoadedPanel();
      if (Object.keys(skelGroups).length === 0 && !meshObj) document.getElementById('empty-hint').style.display = 'block';
    }
    else if (msg.type === 'all_skeletons_removed') {
      for (const sg of Object.values(skelGroups)) scene.remove(sg.group);
      for (const k of Object.keys(skelGroups)) delete skelGroups[k];
      document.querySelectorAll('#pickTarget option[value^="skel:"]').forEach(o => o.remove());
      updateLoadedPanel();
      if (!meshObj) document.getElementById('empty-hint').style.display = 'block';
    }
    else if (msg.type === 'mesh_removed') {
      if (meshObj) { scene.remove(meshObj); meshObj.geometry.dispose(); meshObj.material.dispose(); meshObj = null; }
      if (wireframeObj) { scene.remove(wireframeObj); wireframeObj.geometry.dispose(); wireframeObj.material.dispose(); wireframeObj = null; }
      meshGeometry = null;
      document.getElementById('nVerts').textContent = '-';
      document.getElementById('nFaces').textContent = '-';
      updateLoadedPanel();
      if (Object.keys(skelGroups).length === 0) document.getElementById('empty-hint').style.display = 'block';
    }
  };
  ws.onerror = (err) => console.error('[skeliner] WebSocket error:', err);
  ws.onclose = () => { console.log('[skeliner] WebSocket closed, reconnecting in 2s...'); setTimeout(connectWebSocket, 2000); };
}

function onResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

init();
</script>
