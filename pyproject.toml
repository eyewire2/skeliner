[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skeliner"
version = "0.2.7"
description = "A lightweight neuromorphological mesh skeletonizer."
authors = []
requires-python = ">=3.10.0"
dependencies = [
    "igraph>=0.11.8",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "trimesh==4.7.4",
    "matplotlib>=3.10.3",
    "rtree>=1.4.1",
    "pandas>=2.3.3",
    "jupyterlab>=4.4.10",
    "notebook>=7.4.7",
    "jupyter>=1.1.1",
    "pytest>=8.3.5",
    "python-multipart>=0.0.22",
    "scikit-learn>=1.7.2",
    "shapely>=2.1.2",
    "scikit-image>=0.25.2",
    "flake8>=7.3.0",
]
license = "GPL-3.0-or-later"
readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "twine", 
    "maturin",
    "ipykernel>=7.1.0",
    "watermark>=2.5.0",
]
3d = [
    "vtk>=9.4.2",
]
viewer = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
skeliner = "skeliner.__main__:main"

[tool.setuptools]
packages = {find = {}}
include-package-data = true


