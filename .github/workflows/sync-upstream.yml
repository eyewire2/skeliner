name: Sync main with upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # SYNC_TOKEN: fine-grained PAT with Contents + Workflows write. GITHUB_TOKEN can
      # never push upstream changes to .github/workflows/, so it can't do this merge.
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::SYNC_TOKEN secret is not set"; exit 1; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main

      # GitHub disables schedules after 60 days without repo activity; this prevents it.
      - name: Keep schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-upstream.yml/enable"
